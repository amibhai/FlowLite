name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Self-test
        run: flowlite selftest

  # The core must work with nothing but the standard library. This job installs
  # no optional dependency, so a stray import of PyYAML, paramiko, geoip2 or
  # numpy in a core path fails the build.
  stdlib-only:
    name: stdlib-only core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install without optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Confirm nothing optional is present
        run: |
          python - <<'EOF'
          import importlib
          for name in ("yaml", "paramiko", "geoip2", "numpy"):
              try:
                  importlib.import_module(name)
              except ImportError:
                  print(f"ok: {name} absent")
              else:
                  raise SystemExit(f"{name} is installed; this job must run without it")
          EOF

      - name: Self-test on the standard library alone
        run: flowlite selftest

      - name: Analyse a capture end to end
        run: |
          python -c "from flowlite import synth; synth.write_pcapng('sample.pcapng', synth.synthetic_session())"
          flowlite decode sample.pcapng
          flowlite process sample.pcapng --set paths.data_dir=./ci-out
          test -s ./ci-out/network_ts.csv
          test -s ./ci-out/host_profiles/host_profiles.csv

      - name: Configuration works without PyYAML
        run: |
          flowlite init -o ci.yaml
          flowlite config -c ci.yaml >/dev/null
          flowlite doctor --offline -c ci.yaml || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q --cov=flowlite --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
